[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  included_files = ["*.jpg", "*.png", "zoho_inventory_cache.json", "productImage.js"]

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

# Optimal caching for static product images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"

# Optimal caching for the scroll animation frame sequences
[[headers]]
  for = "/frames/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Direct product image routes - routed to serverless function for guaranteed binary JPEG delivery
[[redirects]]
  from = "/product-minato.jpg"
  to = "/.netlify/functions/api/product-minato.jpg"
  status = 200

[[redirects]]
  from = "/product-ts-min-001.jpg"
  to = "/.netlify/functions/api/product-ts-min-001.jpg"
  status = 200

[[redirects]]
  from = "/product-image"
  to = "/.netlify/functions/api/product-image"
  status = 200

# Direct access for Zoho cache file
[[redirects]]
  from = "/zoho_inventory_cache.json"
  to = "/zoho_inventory_cache.json"
  status = 200

# API redirect to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA routing redirect rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
